<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>非対称協力ロビー 接続テスト</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; max-width: 640px; margin: 0 auto; line-height: 1.5; color: #333; }
    .card { background: #fdfdfd; border: 1px solid #e0e0e0; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    h1 { font-size: 18px; margin-top: 0; }
    h2 { font-size: 15px; margin-top: 0; color: #555; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: bold; background: #eee; }
    .badge.host { background: #e0f2fe; color: #0369a1; }
    .badge.guest { background: #fef3c7; color: #b45309; }
    
    .role-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .role-card { display: flex; align-items: center; justify-content: space-between; border: 2px solid #ddd; padding: 12px; border-radius: 8px; }
    .role-card.taken { background: #f5f5f5; border-color: #ddd; opacity: 0.7; }
    .role-card.selected { border-color: #2563eb; background: #eff6ff; }
    
    button { cursor: pointer; padding: 8px 16px; border-radius: 6px; border: none; font-weight: bold; }
    .btn-select { background: #2563eb; color: #fff; }
    .btn-select:disabled { background: #ccc; cursor: not-allowed; }
    .btn-retry { background: #10b981; color: #fff; margin-top: 8px; }
    
    #share-box { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 10px; border-radius: 6px; margin-top: 8px; word-break: break-all; font-size: 12px; }
    #log { background: #1e293b; color: #f8fafc; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 11px; height: 140px; overflow-y: auto; }
    .log-err { color: #f87171; }
    .log-suc { color: #4ade80; }
  </style>
</head>
<body>

  <h1>非対称協力ゲーム：ロビー接続テスト</h1>
  
  <div class="card">
    <div>現在のあなたの立場: <span id="my-badge" class="badge">接続中...</span></div>
    
    <!-- ホスト用パネル -->
    <div id="host-panel" style="display:none; margin-top: 12px;">
      <p style="margin: 0; font-size: 13px; font-weight: bold;">ゲスト用 招待URL:</p>
      <div id="share-box">発行待機中...</div>
    </div>

    <!-- ゲスト用手動接続ボタン（Safari対策） -->
    <div id="guest-panel" style="display:none; margin-top: 8px;">
      <button class="btn-retry" id="btn-manual-connect" onclick="retryConnect()">接続を再試行する</button>
    </div>
  </div>

  <div class="card">
    <h2>役職選択（各1名・リアルタイム同期）</h2>
    <div class="role-list">
      <div class="role-card" id="card-A">
        <div>
          <strong>役職 A（潜入者）</strong>
          <div style="font-size: 12px; color: #666;" id="holder-A">未選択</div>
        </div>
        <button class="btn-select" id="btn-A" onclick="chooseRole('A')" disabled>選択する</button>
      </div>

      <div class="role-card" id="card-B">
        <div>
          <strong>役職 B（管制官）</strong>
          <div style="font-size: 12px; color: #666;" id="holder-B">未選択</div>
        </div>
        <button class="btn-select" id="btn-B" onclick="chooseRole('B')" disabled>選択する</button>
      </div>

      <div class="role-card" id="card-C">
        <div>
          <strong>役職 C（暗号解読班）</strong>
          <div style="font-size: 12px; color: #666;" id="holder-C">未選択</div>
        </div>
        <button class="btn-select" id="btn-C" onclick="chooseRole('C')" disabled>選択する</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>通信ログ</h2>
    <div id="log"></div>
  </div>

  <script>
    const logBox = document.getElementById('log');
    function log(msg, type = 'normal') {
      const cls = type === 'error' ? ' class="log-err"' : (type === 'success' ? ' class="log-suc"' : '');
      logBox.innerHTML += `<div${cls}>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const hostRoomId = urlParams.get('room');
    const isHost = !hostRoomId;

    // Google公開STUNサーバーの明示指定
    // STUN（直接接続用）＋ TURN（リレー中継用）のハイブリッド設定
    const peerConfig = {
      config: {
        iceServers: [
          // Google STUNサーバー
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          
          // Open Relay Project 提供の無料TURNサーバー（ポート指定で確実にファイアウォールを貫通）
          {
            urls: 'turn:openrelay.metered.ca:80',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          },
          {
            urls: 'turn:openrelay.metered.ca:443',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          },
          {
            urls: 'turn:openrelay.metered.ca:443?transport=tcp',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          }
        ]
      },
      debug: 1
    };

    const peer = new Peer(peerConfig);
    let myId = '';
    let connections = [];
    let hostConn = null;
    let rolesState = { A: null, B: null, C: null };

    // Peer全体の全般エラー監視
    peer.on('error', (err) => {
      log(`Peerエラー発生 (${err.type}): ${err.message}`, 'error');
    });

    peer.on('open', (id) => {
      myId = id;
      log(`自分のPeerID取得成功: ${id.slice(0, 8)}...`, 'success');

      if (isHost) {
        document.getElementById('my-badge').className = 'badge host';
        document.getElementById('my-badge').textContent = 'ホスト (部屋主)';
        document.getElementById('host-panel').style.display = 'block';

        const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${myId}`;
        document.getElementById('share-box').textContent = inviteUrl;
        log(`ホスト待機中... 招待URLを共有してください`);
        enableButtons();

        peer.on('connection', (conn) => {
          log(`相手からの接続要求を検知: ${conn.peer.slice(0, 6)}...`);
          
          conn.on('open', () => {
            connections.push(conn);
            log(`🎉 ゲスト (${conn.peer.slice(0, 6)}) との通信確立！`, 'success');
            conn.send({ type: 'ROLES_SYNC', roles: rolesState });
          });

          conn.on('data', (data) => {
            if (data.type === 'SELECT_ROLE') {
              handleRoleSelection(conn.peer, data.role);
            }
          });

          conn.on('error', (e) => log(`接続エラー(${conn.peer.slice(0, 6)}): ${e}`, 'error'));

          conn.on('close', () => {
            connections = connections.filter(c => c.peer !== conn.peer);
            for (const r in rolesState) {
              if (rolesState[r] === conn.peer) rolesState[r] = null;
            }
            broadcastRoles();
            updateUI();
            log(`ゲスト退出: ${conn.peer.slice(0, 6)}`);
          });
        });

      } else {
        document.getElementById('my-badge').className = 'badge guest';
        document.getElementById('my-badge').textContent = 'ゲスト (参加者)';
        document.getElementById('guest-panel').style.display = 'block';

        connectToHost();
      }
    });

    function connectToHost() {
      if (!hostRoomId) return;
      log(`ホスト(${hostRoomId.slice(0, 8)}...)へ接続試行中...`);

      // reliable: true で確実にデータチャネルを開く
      hostConn = peer.connect(hostRoomId, { reliable: true });

      hostConn.on('open', () => {
        log('🎉 ホストに接続成功！役職を選択してください。', 'success');
        enableButtons();
      });

      hostConn.on('data', (data) => {
        if (data.type === 'ROLES_SYNC') {
          rolesState = data.roles;
          updateUI();
        }
      });

      hostConn.on('error', (err) => {
        log(`接続先エラー: ${err}`, 'error');
      });

      hostConn.on('close', () => {
        log('ホストとの接続が切断されました。', 'error');
      });
    }

    // 再試行ボタン
    window.retryConnect = function() {
      if (hostConn) {
        try { hostConn.close(); } catch(e){}
      }
      connectToHost();
    };

    function enableButtons() {
      ['A', 'B', 'C'].forEach(role => {
        document.getElementById(`btn-${role}`).disabled = false;
      });
      updateUI();
    }

    function handleRoleSelection(peerId, role) {
      if (rolesState[role] && rolesState[role] !== peerId) return;
      for (const r in rolesState) {
        if (rolesState[r] === peerId) rolesState[r] = null;
      }
      rolesState[role] = peerId;
      broadcastRoles();
      updateUI();
    }

    function broadcastRoles() {
      const payload = { type: 'ROLES_SYNC', roles: rolesState };
      connections.forEach(conn => {
        if (conn.open) conn.send(payload);
      });
    }

    window.chooseRole = function(role) {
      if (isHost) {
        handleRoleSelection(myId, role);
      } else {
        if (hostConn && hostConn.open) {
          hostConn.send({ type: 'SELECT_ROLE', role: role });
        } else {
          log('ホストとの接続が完了していません。', 'error');
        }
      }
    };

    function updateUI() {
      ['A', 'B', 'C'].forEach(role => {
        const holderId = rolesState[role];
        const card = document.getElementById(`card-${role}`);
        const holderLabel = document.getElementById(`holder-${role}`);
        const btn = document.getElementById(`btn-${role}`);

        card.classList.remove('taken', 'selected');

        if (!holderId) {
          holderLabel.textContent = '空き';
          holderLabel.style.color = '#16a34a';
          btn.disabled = false;
          btn.textContent = '選択する';
        } else if (holderId === myId) {
          holderLabel.textContent = 'あなたが選択中';
          holderLabel.style.color = '#2563eb';
          card.classList.add('selected');
          btn.disabled = true;
          btn.textContent = '選択済';
        } else {
          holderLabel.textContent = `選択済 (${holderId.slice(0, 5)}...)`;
          holderLabel.style.color = '#888';
          card.classList.add('taken');
          btn.disabled = true;
          btn.textContent = '選択不可';
        }
      });
    }
  </script>
</body>
</html>
